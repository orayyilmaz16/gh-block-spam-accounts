name: Detect and block GitHub spam accounts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      block-users:
        description: "Gerçekten engelleme yapılsın mı? (false = sadece rapor)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  spam-blocker:
    runs-on: ubuntu-latest

    steps:
      - name: Block spam users
        id: spam_blocker
        uses: dessant/block-spam-users@v3
        with:
          github_token: ${{ secrets.GH_PATH }}
          block: ${{ github.event.inputs['block-users'] }}
          report: true

      - name: Print summary
        run: |
          echo "Spam blocker finished."
          echo "Blocking enabled: ${{ github.event.inputs['block-users'] }}"
